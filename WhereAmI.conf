#!name=Where Am I · 时区/定位跟随出口
#!desc=改自 Greasy Fork #600207（Z健C，v6.6.6）：网页的时区与 Geolocation 跟随代理出口 IP；出口查询在 QX 内完成，页面内不发请求。仅注入 hostname 中的站点。
#!source=https://greasyfork.org/scripts/600207 （CC BY-NC-SA 4.0）

# 用法：[rewrite_remote] 引用本文件 raw 链接，启用 MitM 并信任证书。
# 只有下面 hostname 里的站点会被注入 —— 想让哪个站看到「自洽」的时区/定位就加进去。
#
# ⚠ MitM 对 iOS 上所有 App 生效：有证书锁定的 App（不少官方客户端）会因此连不上，
#   这类域名只适合在 Safari 里用，App 打不开就把它从 hostname 里拿掉。
# ⚠ Safari 若走 HTTP/3（QUIC）会绕过 MitM，不生效时在 QX 里丢弃 UDP 443（udp_drop_list = 443）。

hostname = browserleaks.com, *.browserleaks.com, whoer.net, pixelscan.net, ipleak.net, iphey.com, abrahamjuliot.github.io

# 主功能：HTML 文档注入（静态资源扩展名直接排除，避免给图片/视频跑脚本）
^https?:\/\/(?![^?#]*\.(?:js|mjs|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|json|xml|txt|map|wasm|mp4|webm|m3u8|ts|mp3|m4a)(?:[?#]|$)).+$ url script-response-body https://raw.githubusercontent.com/C1511/qx-rules/main/Scripts/where-am-i.js

# 可选：langMode 设为 'match' 或 'en' 时取消下一行注释，让 Accept-Language 与 JS 侧一致
# ^https?:\/\/.+ url script-request-header https://raw.githubusercontent.com/C1511/qx-rules/main/Scripts/where-am-i.js

# 可选（放进主配置 [task_local]，重写资源里不能写 task）：切节点后点一下立即刷新并通知当前出口
# event-interaction https://raw.githubusercontent.com/C1511/qx-rules/main/Scripts/where-am-i.js, tag=Where Am I, img-url=location.circle.system, enabled=true
